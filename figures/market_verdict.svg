<svg width="100%" viewBox="0 0 760 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Station two examined properly: the split branches into shuffle and past-to-future</title>
<desc>The same five-step pipeline. Station two, the split, is flagged in red, and a branch grows out of it into two ways of cutting the days: a random shuffle scoring 0.612, and a past-to-future cut scoring 0.587.</desc>
<style>
.card{fill:#ffffff;stroke:#ececf0;stroke-width:1}
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:19px;font-weight:700}
.st{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:12px}
.nm{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2d3d;font-size:14px;font-weight:600}
.dim{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#9aa3ae;font-size:14px;font-weight:600}
.sub{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:11px}
.dsub{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#b3bac3;font-size:11px}
.inb{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#9aa3ae;font-size:13px;font-weight:600}
.bn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#ffffff;font-size:11px;font-weight:700}
.cn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2d3d;font-size:13px;font-weight:700}
.cs{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:10.5px}
.ft{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#2b333f;font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#e3e7ec;stroke-width:1.2}
.hot{fill:#fdf1f0;stroke:#c85a52;stroke-width:1.8}
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="379" rx="12"/>
<text class="ti" x="40" y="36">Can we trust 0.612?</text>
<text class="st" x="40" y="58">Station two, this time examined properly.</text>

<text class="inb" x="47" y="128" text-anchor="middle">6,658</text>
<text class="dsub" x="47" y="144" text-anchor="middle">days</text>
<line x1="80" y1="131" x2="94" y2="131" stroke="#c8ced6" stroke-width="1.6"/>

<rect class="box" x="96" y="86" width="108" height="90" rx="10"/>
<rect class="hot" x="224" y="86" width="108" height="90" rx="10"/>
<rect class="box" x="352" y="86" width="108" height="90" rx="10"/>
<rect class="box" x="480" y="86" width="108" height="90" rx="10"/>
<rect class="box" x="608" y="86" width="108" height="90" rx="10"/>
<line x1="204" y1="131" x2="224" y2="131" stroke="#c8ced6" stroke-width="1.6"/>
<line x1="332" y1="131" x2="352" y2="131" stroke="#c8ced6" stroke-width="1.6"/>
<line x1="460" y1="131" x2="480" y2="131" stroke="#c8ced6" stroke-width="1.6"/>
<line x1="588" y1="131" x2="608" y2="131" stroke="#c8ced6" stroke-width="1.6"/>

<circle cx="150" cy="108" r="13" fill="#b8c0cc"/><text class="bn" x="150" y="112" text-anchor="middle">1</text>
<circle cx="278" cy="108" r="13" fill="#c85a52"/><text class="bn" x="278" y="112" text-anchor="middle">2</text>
<circle cx="406" cy="108" r="13" fill="#b8c0cc"/><text class="bn" x="406" y="112" text-anchor="middle">3</text>
<circle cx="534" cy="108" r="13" fill="#b8c0cc"/><text class="bn" x="534" y="112" text-anchor="middle">4</text>
<circle cx="662" cy="108" r="13" fill="#b8c0cc"/><text class="bn" x="662" y="112" text-anchor="middle">5</text>

<text class="dim" x="150" y="140" text-anchor="middle">Frame</text>
<text class="nm"  x="278" y="140" text-anchor="middle">Split</text>
<text class="dim" x="406" y="140" text-anchor="middle">Scale</text>
<text class="dim" x="534" y="140" text-anchor="middle">Build</text>
<text class="dim" x="662" y="140" text-anchor="middle">Measure</text>
<text class="dsub" x="150" y="158" text-anchor="middle">busy or calm?</text>
<text class="sub"  x="278" y="158" text-anchor="middle">how do we cut it?</text>
<text class="dsub" x="406" y="158" text-anchor="middle">level the sizes</text>
<text class="dsub" x="534" y="158" text-anchor="middle">train the net</text>
<text class="dsub" x="662" y="158" text-anchor="middle">vs a coin</text>

<path d="M278 176 L278 208" stroke="#c85a52" stroke-width="1.8" fill="none"/>
<path d="M278 208 L195 238" stroke="#c85a52" stroke-width="1.8" fill="none"/>
<path d="M278 208 L365 238" stroke="#c85a52" stroke-width="1.8" fill="none"/>

<rect x="120" y="238" width="150" height="86" rx="10" fill="#ffffff" stroke="#d3d9e0" stroke-width="1.3"/>
<text class="cn" x="195" y="261" text-anchor="middle">shuffle at random</text>
<text class="cs" x="195" y="281" text-anchor="middle">a row and its near-twin</text>
<text class="cs" x="195" y="295" text-anchor="middle">land on opposite sides</text>
<text x="195" y="317" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#c85a52">0.612</text>

<rect x="290" y="238" width="150" height="86" rx="10" fill="#ffffff" stroke="#d3d9e0" stroke-width="1.3"/>
<text class="cn" x="365" y="261" text-anchor="middle">past to future</text>
<text class="cs" x="365" y="281" text-anchor="middle">near-twins stay together</text>
<text class="cs" x="365" y="295" text-anchor="middle">on the same side</text>
<text x="365" y="317" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3a6ea5">0.587</text>

<line x1="40" y1="344" x2="720" y2="344" stroke="#ececf0" stroke-width="1"/>
<text class="ft" x="40" y="368">Station two: the exam had been spoiled before we ever marked it.</text>
<rect x="612" y="350" width="94" height="24" rx="12" fill="#fbe3e1" stroke="#c85a52" stroke-width="1.4"/>
<text x="659" y="366" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b04a42">GUILTY</text>
</svg>
