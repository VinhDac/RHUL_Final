<svg width="100%" viewBox="0 0 680 350" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The loan trail, one try at a time</title>
<desc>A decision trail. Building the model by the book scores 0.817, above the 0.779 do-nothing baseline. The first worry is the split, but every way of cutting the data agrees, so the split is honest and the rows are interchangeable; a position split by raw file order scores 0.83 but that is just CSV ordering and is ignored. The real doubt is the metric: did the model catch the defaulters? It caught only 459 of 1353 and missed 894, so accuracy hid the rare class. The trap was the metric, not the data, and the number to keep is the balanced accuracy of 0.644.</desc>
<rect x="0" y="0" width="680" height="350" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:15px;font-weight:600}
.b{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:13px}
.d{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#8a8a8a;font-size:12px}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999999"/></marker></defs>
<text class="ti" x="20" y="26" text-anchor="start">The loan trail, one try at a time</text>
<rect x="195" y="42" width="290" height="36" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="64" text-anchor="middle">Build by the book: 0.817, beats 0.779</text>
<line x1="340" y1="78" x2="340" y2="96" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="185" y="98" width="310" height="48" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="117" text-anchor="middle">Does the split matter?</text>
<text class="b" x="340" y="135" text-anchor="middle">every cut agrees: it is honest</text>
<line x1="495" y1="122" x2="527" y2="122" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="533" y="101" width="132" height="42" rx="8" fill="#f6f6f8" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="d" x="599" y="117" text-anchor="middle">position 0.83?</text>
<text class="d" x="599" y="133" text-anchor="middle">just CSV order</text>
<line x1="340" y1="146" x2="340" y2="170" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="195" y="172" width="290" height="36" rx="8" fill="#ffffff" stroke="#d98b4a" stroke-width="2"/>
<text class="b" x="340" y="194" text-anchor="middle">But did it catch the defaulters?</text>
<line x1="340" y1="208" x2="340" y2="226" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="195" y="228" width="290" height="36" rx="8" fill="#ffffff" stroke="#d98b4a" stroke-width="2"/>
<text class="b" x="340" y="250" text-anchor="middle">caught only 459 of 1353, missed 894</text>
<line x1="340" y1="264" x2="340" y2="282" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="185" y="284" width="310" height="50" rx="8" fill="#e4efe8" stroke="#6aa87f" stroke-width="1.5"/>
<text class="b" x="340" y="304" text-anchor="middle">the trap was the metric, not the data</text>
<text class="b" x="340" y="322" text-anchor="middle">keep balanced accuracy 0.644</text>
</svg>
