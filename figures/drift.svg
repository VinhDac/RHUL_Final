<svg width="100%" viewBox="0 0 680 210" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The feature drifts out from under the frozen scaler</title>
<desc>A chart over time. A grey band shows what the frozen scaler learned as normal from the early years. The day's move size in points climbs steadily over time, starting inside the band and rising far above it. A dashed line marks where training ends and testing begins; in the test region the feature sits well above the normal band, so the model is asked about values it never saw in training.</desc>
<rect x="0" y="0" width="680" height="210" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:15px;font-weight:600}
.cp{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#666666;font-size:12px}
.lb{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:500}
</style>
<defs><marker id="a2" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333333"/></marker></defs>
<text class="ti" x="20" y="26" text-anchor="start">The feature drifts out from under the frozen scaler</text>
<rect x="90" y="150" width="540" height="26" fill="#9aa4b0" opacity="0.28"/>
<line x1="90" y1="176" x2="630" y2="176" stroke="#cccccc" stroke-width="1"/>
<polyline points="90,170 190,158 300,141 410,119 520,97 630,82" fill="none" stroke="#5b7db1" stroke-width="2.5"/>
<circle cx="630" cy="82" r="3.5" fill="#5b7db1"/>
<text class="lb" x="300" y="128" text-anchor="middle" fill="#5b7db1">day&#8217;s move size, in points</text>
<line x1="520" y1="48" x2="520" y2="176" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="cp" x="300" y="44" text-anchor="middle">train</text>
<text class="cp" x="576" y="44" text-anchor="middle">test</text>
<line x1="565" y1="150" x2="565" y2="100" stroke="#333333" stroke-width="1.2" marker-end="url(#a2)"/>
<text class="lb" x="565" y="92" text-anchor="middle" fill="#333333">far outside</text>
<text class="cp" x="96" y="196" text-anchor="start">frozen &#8220;normal&#8221;, learned on the early years</text>
<text class="cp" x="500" y="207" text-anchor="start">time: early &#8594; late</text>
</svg>
