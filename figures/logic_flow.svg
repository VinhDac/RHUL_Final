<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 772" role="img" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title>Logic flow of the data-snooping thesis</title>
<desc>Nine-step vertical flow: premise score equals truth plus luck; winner's curse mechanism; deep-learning amplification via hidden knobs; measuring with a synthetic lab and sealed test; core result gap grows with N; five hypotheses driving the gap; confirmation on real data; the cure H5; conclusion that trust is a property of the process.</desc>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8f98"/></marker></defs>

<rect x="140" y="34" width="14" height="14" rx="3" fill="#fbeecb" stroke="#e6c360"/>
<text x="160" y="45" font-size="12" fill="#8a8f98">amber = new links: DL amplification + the cure</text>

<rect x="140" y="62" width="400" height="48" rx="8" fill="#eef0f3" stroke="#c9ced6"/>
<text x="340" y="82" font-size="14" font-weight="500" fill="#20242b" text-anchor="middle">premise: score = truth + luck</text>
<text x="340" y="100" font-size="12" fill="#4a4f57" text-anchor="middle">validation is finite → noisy</text>
<line x1="340" y1="110" x2="340" y2="138" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="128" font-size="12" fill="#8a8f98">search N, keep max</text>

<rect x="140" y="140" width="400" height="48" rx="8" fill="#eef0f3" stroke="#c9ced6"/>
<text x="340" y="160" font-size="14" font-weight="500" fill="#20242b" text-anchor="middle">mechanism: keep max of N → the lucky one</text>
<text x="340" y="178" font-size="12" fill="#4a4f57" text-anchor="middle">the reported score inflates = gap</text>
<line x1="340" y1="188" x2="340" y2="216" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="206" font-size="12" fill="#8a8f98">DL searches hardest</text>

<rect x="140" y="218" width="400" height="48" rx="8" fill="#fbeecb" stroke="#e6c360"/>
<text x="340" y="238" font-size="14" font-weight="500" fill="#5a4a10" text-anchor="middle">DL amplifier: hidden knobs — epochs, seed</text>
<text x="340" y="256" font-size="12" fill="#7a6820" text-anchor="middle">effective N huge → gap largest</text>
<line x1="340" y1="266" x2="340" y2="294" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="284" font-size="12" fill="#8a8f98">how to measure?</text>

<rect x="140" y="296" width="400" height="48" rx="8" fill="#eef0f3" stroke="#c9ced6"/>
<text x="340" y="316" font-size="14" font-weight="500" fill="#20242b" text-anchor="middle">measure: synthetic lab + sealed test</text>
<text x="340" y="334" font-size="12" fill="#4a4f57" text-anchor="middle">truth known → exact gap (open once)</text>
<line x1="340" y1="344" x2="340" y2="372" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="362" font-size="12" fill="#8a8f98">run the machine</text>

<rect x="140" y="374" width="400" height="48" rx="8" fill="#eef0f3" stroke="#c9ced6"/>
<text x="340" y="394" font-size="14" font-weight="500" fill="#20242b" text-anchor="middle">core result: N↑ → apparent climbs</text>
<text x="340" y="412" font-size="12" fill="#4a4f57" text-anchor="middle">truth flat → gap↑</text>
<line x1="340" y1="422" x2="340" y2="450" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="440" font-size="12" fill="#8a8f98">what drives the gap?</text>

<rect x="90" y="452" width="500" height="66" rx="8" fill="#eef0f3" stroke="#c9ced6"/>
<text x="340" y="474" font-size="14" font-weight="500" fill="#20242b" text-anchor="middle">5 hypotheses: what drives the gap?</text>
<text x="340" y="498" font-size="12" fill="#4a4f57" text-anchor="middle">H1 N↑ · H2 noise↑ · Hd hidden↑ · H3 size→0 · H4 honest↓</text>
<line x1="340" y1="518" x2="340" y2="546" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="536" font-size="12" fill="#8a8f98">does it bite for real?</text>

<rect x="140" y="548" width="400" height="48" rx="8" fill="#eef0f3" stroke="#c9ced6"/>
<text x="340" y="568" font-size="14" font-weight="500" fill="#20242b" text-anchor="middle">real data: loan muted · finance loses</text>
<text x="340" y="586" font-size="12" fill="#4a4f57" text-anchor="middle">edge 64% → 53% (loses vs buy &amp; hold)</text>
<line x1="340" y1="596" x2="340" y2="624" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="614" font-size="12" fill="#8a8f98">what's the cure?</text>

<rect x="140" y="626" width="400" height="48" rx="8" fill="#fbeecb" stroke="#e6c360"/>
<text x="340" y="646" font-size="14" font-weight="500" fill="#5a4a10" text-anchor="middle">cure (H5): honest B ≥ aggressive A</text>
<text x="340" y="664" font-size="12" fill="#7a6820" text-anchor="middle">small gap → trustworthy · beat baseline &gt; error</text>
<line x1="340" y1="674" x2="340" y2="702" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="352" y="692" font-size="12" fill="#8a8f98">the lesson</text>

<rect x="140" y="704" width="400" height="48" rx="8" fill="#eef0f3" stroke="#c9ced6"/>
<text x="340" y="724" font-size="14" font-weight="500" fill="#20242b" text-anchor="middle">conclusion: trust the process, not the number</text>
<text x="340" y="742" font-size="12" fill="#4a4f57" text-anchor="middle">gap = trust lost per unit of search</text>
</svg>
