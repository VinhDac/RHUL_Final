<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
  <text x="40" y="34" font-size="16" fill="#2b333f" font-weight="600">Why a shuffle leaks: two neighbouring rows are near-twins</text>

  <!-- Row X[0]: days 1..5 -->
  <text x="40" y="86" font-size="13" fill="#1f2d3d" font-weight="600">X[0]</text>
  <text x="40" y="102" font-size="10" fill="#6b7480">days 1-5</text>
  <rect x="90"  y="70" width="52" height="34" rx="4" fill="#c85a52"/><text x="116" y="92" font-size="11" fill="#fff" text-anchor="middle">3.8%</text>
  <rect x="146" y="70" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="172" y="92" font-size="11" fill="#fff" text-anchor="middle">0.2%</text>
  <rect x="202" y="70" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="228" y="92" font-size="11" fill="#fff" text-anchor="middle">0.1%</text>
  <rect x="258" y="70" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="284" y="92" font-size="11" fill="#fff" text-anchor="middle">2.7%</text>
  <rect x="314" y="70" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="340" y="92" font-size="11" fill="#fff" text-anchor="middle">1.1%</text>

  <!-- Row X[1]: days 2..6, shifted one box right so shared days align -->
  <text x="40" y="150" font-size="13" fill="#1f2d3d" font-weight="600">X[1]</text>
  <text x="40" y="166" font-size="10" fill="#6b7480">days 2-6</text>
  <rect x="146" y="134" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="172" y="156" font-size="11" fill="#fff" text-anchor="middle">0.2%</text>
  <rect x="202" y="134" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="228" y="156" font-size="11" fill="#fff" text-anchor="middle">0.1%</text>
  <rect x="258" y="134" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="284" y="156" font-size="11" fill="#fff" text-anchor="middle">2.7%</text>
  <rect x="314" y="134" width="52" height="34" rx="4" fill="#3a6ea5"/><text x="340" y="156" font-size="11" fill="#fff" text-anchor="middle">1.1%</text>
  <rect x="370" y="134" width="52" height="34" rx="4" fill="#c85a52"/><text x="396" y="156" font-size="11" fill="#fff" text-anchor="middle">1.3%</text>

  <!-- shared bracket -->
  <path d="M146 118 L146 112 L366 112 L366 118" fill="none" stroke="#3a6ea5" stroke-width="1.3"/>
  <text x="446" y="116" font-size="12" fill="#3a6ea5" font-weight="600">4 of the 5 numbers are identical</text>

  <!-- shuffle sends them to opposite sides -->
  <line x1="200" y1="200" x2="200" y2="232" stroke="#2b333f" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="312" y1="200" x2="312" y2="232" stroke="#2b333f" stroke-width="1.6" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L8,0 L4,7 Z" fill="#2b333f"/></marker></defs>
  <text x="256" y="222" font-size="11" fill="#5a6472" text-anchor="middle">a shuffle can send the twins to opposite sides</text>

  <!-- two bins -->
  <rect x="96" y="242" width="210" height="70" rx="8" fill="none" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="201" y="264" font-size="13" fill="#2b333f" text-anchor="middle" font-weight="600">TRAIN</text>
  <text x="201" y="286" font-size="11" fill="#5a6472" text-anchor="middle">the model studies X[0]</text>

  <rect x="330" y="242" width="210" height="70" rx="8" fill="none" stroke="#c85a52" stroke-width="1.5"/>
  <text x="435" y="264" font-size="13" fill="#2b333f" text-anchor="middle" font-weight="600">TEST</text>
  <text x="435" y="286" font-size="11" fill="#5a6472" text-anchor="middle">it is then graded on X[1]</text>

  <text x="40" y="342" font-size="12" fill="#2b333f">At test time the model meets a near-double of a row it already trained on, so its "skill" is partly memory.</text>
</svg>
