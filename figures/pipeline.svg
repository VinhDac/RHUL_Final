<svg width="100%" viewBox="0 0 680 134" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The normal way to build a deep-learning model, as a five-step pipeline</title>
<desc>Five boxes in a row, left to right, joined by arrows: Frame the data, Split, Scale, Build and search, Measure. This is the ordinary recipe everyone follows, shown as a clean map before we walk it step by step.</desc>
<rect x="0" y="0" width="680" height="134" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:16px;font-weight:600}
.bx{fill:#ffffff;stroke:#333333;stroke-width:1.5}
.bl{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:13px;font-weight:500}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888888"/></marker></defs>
<text class="ti" x="340" y="28" text-anchor="middle">The normal way to build a model</text>
<rect class="bx" x="16" y="52" width="115" height="54" rx="8"/>
<rect class="bx" x="149" y="52" width="115" height="54" rx="8"/>
<rect class="bx" x="282" y="52" width="115" height="54" rx="8"/>
<rect class="bx" x="415" y="52" width="115" height="54" rx="8"/>
<rect class="bx" x="548" y="52" width="115" height="54" rx="8"/>
<line x1="134" y1="79" x2="146" y2="79" stroke="#888888" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="267" y1="79" x2="279" y2="79" stroke="#888888" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="400" y1="79" x2="412" y2="79" stroke="#888888" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="533" y1="79" x2="545" y2="79" stroke="#888888" stroke-width="1.5" marker-end="url(#ah)"/>
<text class="bl" x="73" y="76" text-anchor="middle">Frame</text>
<text class="bl" x="73" y="93" text-anchor="middle">the data</text>
<text class="bl" x="206" y="84" text-anchor="middle">Split</text>
<text class="bl" x="339" y="84" text-anchor="middle">Scale</text>
<text class="bl" x="472" y="76" text-anchor="middle">Build &amp;</text>
<text class="bl" x="472" y="93" text-anchor="middle">search</text>
<text class="bl" x="605" y="84" text-anchor="middle">Measure</text>
</svg>
