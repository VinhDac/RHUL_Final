<svg width="100%" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Station three examined: the frozen mean and std are a bet on stability</title>
<desc>The same five-step pipeline with station three, Scale, flagged in red. Scaling is (x minus mean) over std, with the mean and std frozen from the training years. A feature that barely drifts (percent) keeps the frozen scaler honest and scores 0.587. A feature that drifts hard (points) leaves it stranded, 0.509 frozen and only 0.528 even when the scaler is re-fit each day.</desc>
<style>
.card{fill:#ffffff;stroke:#ececf0;stroke-width:1}
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:19px;font-weight:700}
.st{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:12px}
.nm{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2d3d;font-size:14px;font-weight:600}
.dim{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#9aa3ae;font-size:14px;font-weight:600}
.sub{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:11px}
.dsub{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#b3bac3;font-size:11px}
.inb{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#9aa3ae;font-size:13px;font-weight:600}
.bn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#ffffff;font-size:11px;font-weight:700}
.cn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2d3d;font-size:12.5px;font-weight:700}
.cs{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:10.5px}
.ft{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#2b333f;font-size:12.5px;font-weight:600}
.box{fill:#ffffff;stroke:#e3e7ec;stroke-width:1.2}
.hot{fill:#fdf1f0;stroke:#c85a52;stroke-width:1.8}
.node{fill:#f7f9fb;stroke:#d3d9e0;stroke-width:1.3}
.leaf{fill:#ffffff;stroke:#d3d9e0;stroke-width:1.3}
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="419" rx="12"/>
<text class="ti" x="40" y="34">And what about the scaling?</text>
<text class="st" x="40" y="56">Scaling is two numbers, a mean and a std, frozen once on the training years.</text>

<text class="inb" x="47" y="126" text-anchor="middle">6,658</text>
<text class="dsub" x="47" y="142" text-anchor="middle">days</text>
<line x1="80" y1="129" x2="94" y2="129" stroke="#c8ced6" stroke-width="1.6"/>

<rect class="box" x="96" y="84" width="108" height="90" rx="10"/>
<rect class="box" x="224" y="84" width="108" height="90" rx="10"/>
<rect class="hot" x="352" y="84" width="108" height="90" rx="10"/>
<rect class="box" x="480" y="84" width="108" height="90" rx="10"/>
<rect class="box" x="608" y="84" width="108" height="90" rx="10"/>
<line x1="204" y1="129" x2="224" y2="129" stroke="#c8ced6" stroke-width="1.6"/>
<line x1="332" y1="129" x2="352" y2="129" stroke="#c8ced6" stroke-width="1.6"/>
<line x1="460" y1="129" x2="480" y2="129" stroke="#c8ced6" stroke-width="1.6"/>
<line x1="588" y1="129" x2="608" y2="129" stroke="#c8ced6" stroke-width="1.6"/>

<circle cx="150" cy="106" r="13" fill="#b8c0cc"/><text class="bn" x="150" y="110" text-anchor="middle">1</text>
<circle cx="278" cy="106" r="13" fill="#b8c0cc"/><text class="bn" x="278" y="110" text-anchor="middle">2</text>
<circle cx="406" cy="106" r="13" fill="#c85a52"/><text class="bn" x="406" y="110" text-anchor="middle">3</text>
<circle cx="534" cy="106" r="13" fill="#b8c0cc"/><text class="bn" x="534" y="110" text-anchor="middle">4</text>
<circle cx="662" cy="106" r="13" fill="#b8c0cc"/><text class="bn" x="662" y="110" text-anchor="middle">5</text>

<text class="dim" x="150" y="138" text-anchor="middle">Frame</text>
<text class="dim" x="278" y="138" text-anchor="middle">Split</text>
<text class="nm"  x="406" y="138" text-anchor="middle">Scale</text>
<text class="dim" x="534" y="138" text-anchor="middle">Build</text>
<text class="dim" x="662" y="138" text-anchor="middle">Measure</text>
<text class="dsub" x="150" y="156" text-anchor="middle">busy or calm?</text>
<text class="dsub" x="278" y="156" text-anchor="middle">past to future</text>
<text class="sub"  x="406" y="156" text-anchor="middle">mean &amp; std, frozen</text>
<text class="dsub" x="534" y="156" text-anchor="middle">train the net</text>
<text class="dsub" x="662" y="156" text-anchor="middle">vs a coin</text>

<path d="M406 174 L406 204" stroke="#c85a52" stroke-width="1.8" fill="none"/>
<path d="M406 204 L215 226" stroke="#c85a52" stroke-width="1.8" fill="none"/>
<path d="M406 204 L560 226" stroke="#c85a52" stroke-width="1.8" fill="none"/>

<rect class="node" x="128" y="226" width="174" height="48" rx="9"/>
<text class="cn" x="215" y="247" text-anchor="middle">a feature that barely drifts</text>
<text class="cs" x="215" y="264" text-anchor="middle">percent: 0.85% to 0.75%</text>

<rect class="node" x="473" y="226" width="174" height="48" rx="9"/>
<text class="cn" x="560" y="247" text-anchor="middle">a feature that drifts hard</text>
<text class="cs" x="560" y="264" text-anchor="middle">points: 10.6 to 37</text>

<path d="M215 274 L215 310" stroke="#c8ced6" stroke-width="1.6" fill="none"/>
<path d="M560 274 L560 290" stroke="#c8ced6" stroke-width="1.6" fill="none"/>
<path d="M560 290 L470 310" stroke="#c8ced6" stroke-width="1.6" fill="none"/>
<path d="M560 290 L650 310" stroke="#c8ced6" stroke-width="1.6" fill="none"/>

<rect class="leaf" x="130" y="310" width="170" height="60" rx="9"/>
<text class="cs" x="215" y="330" text-anchor="middle">frozen scaler still fits</text>
<text x="215" y="354" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3a6ea5">0.587</text>

<rect class="leaf" x="388" y="310" width="164" height="60" rx="9"/>
<text class="cs" x="470" y="330" text-anchor="middle">frozen scaler stranded</text>
<text x="470" y="354" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#c85a52">0.509</text>

<rect class="leaf" x="568" y="310" width="164" height="60" rx="9"/>
<text class="cs" x="650" y="330" text-anchor="middle">re-fit every day</text>
<text x="650" y="354" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#6b7480">0.528</text>

<line x1="40" y1="386" x2="720" y2="386" stroke="#ececf0" stroke-width="1"/>
<text class="ft" x="40" y="408">The frozen mean and std were a bet that normal stays normal, and nothing checked it.</text>
<rect x="612" y="392" width="94" height="24" rx="12" fill="#fbe3e1" stroke="#c85a52" stroke-width="1.4"/>
<text x="659" y="408" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b04a42">GUILTY</text>
</svg>
