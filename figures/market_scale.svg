.bn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#ffffff;font-size:11px;font-weight:700}
.cn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2d3d;font-size:13px;font-weight:700}
