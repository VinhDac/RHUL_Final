<text class="cs" x="215" y="267" text-anchor="middle">stays in the same ballpark</text>

<rect class="node" x="470" y="230" width="170" height="46" rx="9"/>
<text class="cn" x="555" y="251" text-anchor="middle">measured in points</text>
<text class="cs" x="555" y="267" text-anchor="middle">drifts up with the index</text>

<path d="M215 276 L215 312" stroke="#c8ced6" stroke-width="1.6" fill="none"/>
<path d="M555 276 L555 292" stroke="#c8ced6" stroke-width="1.6" fill="none"/>
<path d="M555 292 L470 312" stroke="#c8ced6" stroke-width="1.6" fill="none"/>
<path d="M555 292 L646 312" stroke="#c8ced6" stroke-width="1.6" fill="none"/>

<rect class="leaf" x="130" y="312" width="170" height="58" rx="9"/>
