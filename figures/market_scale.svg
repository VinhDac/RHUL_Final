<svg width="100%" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Station three examined: the unit and the scaler branch, and neither scaler rescues a drifting feature</title>
<desc>The same five-step pipeline with station three, Scale, flagged in red. A branch grows out of it: measured in percent with a frozen scaler scores 0.587, measured in points with a frozen scaler scores 0.509, and with a rolling scaler 0.528.</desc>
<style>
