<svg width="100%" viewBox="0 0 760 175" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The plan for the loan clients: a five-step pipeline</title>
<desc>Thirty thousand clients feed into five steps in a row: Frame the yes-or-no question, Split into train/validation/test, Scale the 23 features, Build and train the network, Measure accuracy on the test set.</desc>
<style>
.card{fill:#ffffff;stroke:#ececf0;stroke-width:1}
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:16px;font-weight:600}
.nm{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2d3d;font-size:14px;font-weight:600}
.sub{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:11px}
.inb{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#d3d9e0;stroke-width:1.3}
.bdg{fill:#3a6ea5}
.bn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#ffffff;font-size:11px;font-weight:700}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3a6ea5"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="759" height="174" rx="12"/>
<text class="ti" x="380" y="30" text-anchor="middle">The plan for the loan clients</text>
<text class="inb" x="47" y="100" text-anchor="middle">30,000</text>
<text class="sub" x="47" y="116" text-anchor="middle">clients</text>
<line x1="80" y1="103" x2="94" y2="103" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<rect class="box" x="96" y="58" width="108" height="90" rx="10"/>
<rect class="box" x="224" y="58" width="108" height="90" rx="10"/>
<rect class="box" x="352" y="58" width="108" height="90" rx="10"/>
<rect class="box" x="480" y="58" width="108" height="90" rx="10"/>
<rect class="box" x="608" y="58" width="108" height="90" rx="10"/>
<line x1="204" y1="103" x2="224" y2="103" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="332" y1="103" x2="352" y2="103" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="460" y1="103" x2="480" y2="103" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="588" y1="103" x2="608" y2="103" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<circle class="bdg" cx="150" cy="80" r="11"/><text class="bn" x="150" y="84" text-anchor="middle">1</text>
<circle class="bdg" cx="278" cy="80" r="11"/><text class="bn" x="278" y="84" text-anchor="middle">2</text>
<circle class="bdg" cx="406" cy="80" r="11"/><text class="bn" x="406" y="84" text-anchor="middle">3</text>
<circle class="bdg" cx="534" cy="80" r="11"/><text class="bn" x="534" y="84" text-anchor="middle">4</text>
<circle class="bdg" cx="662" cy="80" r="11"/><text class="bn" x="662" y="84" text-anchor="middle">5</text>
<text class="nm" x="150" y="110" text-anchor="middle">Frame</text>
<text class="nm" x="278" y="110" text-anchor="middle">Split</text>
<text class="nm" x="406" y="110" text-anchor="middle">Scale</text>
<text class="nm" x="534" y="110" text-anchor="middle">Build</text>
<text class="nm" x="662" y="110" text-anchor="middle">Measure</text>
<text class="sub" x="150" y="129" text-anchor="middle">yes or no?</text>
<text class="sub" x="278" y="129" text-anchor="middle">train / val / test</text>
<text class="sub" x="406" y="129" text-anchor="middle">level the features</text>
<text class="sub" x="534" y="129" text-anchor="middle">train the net</text>
<text class="sub" x="662" y="129" text-anchor="middle">count the hits</text>
</svg>
