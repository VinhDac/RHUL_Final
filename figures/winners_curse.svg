<svg width="100%" viewBox="0 0 680 258" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The winner's curse: the best of many tries drifts above the truth</title>
<desc>Three rows of scores, for one try, ten tries, and a hundred tries. Each score scatters around the true value of 0.5, shown as a dashed vertical line. In each row the score we keep, the highest, is marked in orange. As the number of tries grows, the kept score sits further and further to the right of 0.5, even though the truth never moves.</desc>
<rect x="0" y="0" width="680" height="258" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:15px;font-weight:600}
.cp{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#666666;font-size:12px}
.rl{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#333333;font-size:12px;font-weight:500}
</style>
<text class="ti" x="20" y="24" text-anchor="start">The winner's curse: the best of many tries drifts above the truth</text>
<circle cx="404" cy="41" r="5.5" fill="#d98b4a"/>
<text class="cp" x="415" y="45" text-anchor="start">the one we keep</text>
<circle cx="530" cy="41" r="4" fill="#a9bcd8"/>
<text class="cp" x="540" y="45" text-anchor="start">the rest</text>
<line x1="320" y1="60" x2="320" y2="222" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="cp" x="320" y="56" text-anchor="middle">truth = 0.5</text>
<line x1="120" y1="95" x2="620" y2="95" stroke="#eeeeee" stroke-width="1"/>
<line x1="120" y1="150" x2="620" y2="150" stroke="#eeeeee" stroke-width="1"/>
<line x1="120" y1="200" x2="620" y2="200" stroke="#eeeeee" stroke-width="1"/>
<text class="rl" x="30" y="99" text-anchor="start">1 try</text>
<text class="rl" x="30" y="154" text-anchor="start">10 tries</text>
<text class="rl" x="30" y="204" text-anchor="start">100 tries</text>
<circle cx="345" cy="95" r="5.5" fill="#d98b4a"/>
<circle cx="220" cy="150" r="4" fill="#a9bcd8"/>
<circle cx="295" cy="143" r="4" fill="#a9bcd8"/>
<circle cx="345" cy="157" r="4" fill="#a9bcd8"/>
<circle cx="395" cy="146" r="4" fill="#a9bcd8"/>
<circle cx="270" cy="154" r="4" fill="#a9bcd8"/>
<circle cx="320" cy="150" r="4" fill="#a9bcd8"/>
<circle cx="370" cy="143" r="4" fill="#a9bcd8"/>
<circle cx="245" cy="157" r="4" fill="#a9bcd8"/>
<circle cx="170" cy="146" r="4" fill="#a9bcd8"/>
<circle cx="445" cy="150" r="5.5" fill="#d98b4a"/>
<circle cx="170" cy="200" r="4" fill="#a9bcd8"/>
<circle cx="245" cy="193" r="4" fill="#a9bcd8"/>
<circle cx="295" cy="207" r="4" fill="#a9bcd8"/>
<circle cx="320" cy="196" r="4" fill="#a9bcd8"/>
<circle cx="370" cy="204" r="4" fill="#a9bcd8"/>
<circle cx="220" cy="200" r="4" fill="#a9bcd8"/>
<circle cx="345" cy="193" r="4" fill="#a9bcd8"/>
<circle cx="395" cy="207" r="4" fill="#a9bcd8"/>
<circle cx="270" cy="196" r="4" fill="#a9bcd8"/>
<circle cx="420" cy="204" r="4" fill="#a9bcd8"/>
<circle cx="320" cy="207" r="4" fill="#a9bcd8"/>
<circle cx="470" cy="196" r="4" fill="#a9bcd8"/>
<circle cx="395" cy="200" r="4" fill="#a9bcd8"/>
<circle cx="520" cy="200" r="5.5" fill="#d98b4a"/>
<text class="cp" x="370" y="244" text-anchor="middle">the more we try, the further the best sits above 0.5</text>
</svg>
