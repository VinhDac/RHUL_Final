<svg width="100%" viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The plan, corrected: every fault we found has been repaired</title>
<desc>The same five-step pipeline. The split is fixed to run past to future, the scale is fixed to a non-drifting feature in percent, and the build and the measure carry their earlier clean verdicts. Station one, Frame, carries no verdict at all.</desc>
<style>
.card{fill:#ffffff;stroke:#ececf0;stroke-width:1}
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:19px;font-weight:700}
.st{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:12px}
.nm{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2d3d;font-size:14px;font-weight:600}
.sub{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#6b7480;font-size:11px}
.inb{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:13px;font-weight:600}
.ev{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#2b333f;font-size:10px}
.ok{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#3d7550;font-size:11px;font-weight:700}
.ft{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#2b333f;font-size:13px;font-weight:600}
.box{fill:#ffffff;stroke:#d3d9e0;stroke-width:1.3}
.bdg{fill:#3a6ea5}
.bn{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#ffffff;font-size:11px;font-weight:700}
.chip{fill:#eaf3ec;stroke:#4a8a5c;stroke-width:1.2}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3a6ea5"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="759" height="299" rx="12"/>
<text class="ti" x="40" y="36">The plan, corrected</text>
<text class="st" x="40" y="58">Every fault we found, repaired. This time we have checked our work.</text>

<text class="inb" x="47" y="128" text-anchor="middle">6,658</text>
<text class="sub" x="47" y="144" text-anchor="middle">days</text>
<line x1="80" y1="131" x2="94" y2="131" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>

<rect class="box" x="96" y="86" width="108" height="90" rx="10"/>
<rect class="box" x="224" y="86" width="108" height="90" rx="10"/>
<rect class="box" x="352" y="86" width="108" height="90" rx="10"/>
<rect class="box" x="480" y="86" width="108" height="90" rx="10"/>
<rect class="box" x="608" y="86" width="108" height="90" rx="10"/>
<line x1="204" y1="131" x2="224" y2="131" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="332" y1="131" x2="352" y2="131" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="460" y1="131" x2="480" y2="131" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="588" y1="131" x2="608" y2="131" stroke="#3a6ea5" stroke-width="1.6" marker-end="url(#ar)"/>

<circle class="bdg" cx="150" cy="108" r="13"/><text class="bn" x="150" y="112" text-anchor="middle">1</text>
<circle class="bdg" cx="278" cy="108" r="13"/><text class="bn" x="278" y="112" text-anchor="middle">2</text>
<circle class="bdg" cx="406" cy="108" r="13"/><text class="bn" x="406" y="112" text-anchor="middle">3</text>
<circle class="bdg" cx="534" cy="108" r="13"/><text class="bn" x="534" y="112" text-anchor="middle">4</text>
<circle class="bdg" cx="662" cy="108" r="13"/><text class="bn" x="662" y="112" text-anchor="middle">5</text>

<text class="nm" x="150" y="140" text-anchor="middle">Frame</text>
<text class="nm" x="278" y="140" text-anchor="middle">Split</text>
<text class="nm" x="406" y="140" text-anchor="middle">Scale</text>
<text class="nm" x="534" y="140" text-anchor="middle">Build</text>
<text class="nm" x="662" y="140" text-anchor="middle">Measure</text>
<text class="sub" x="150" y="158" text-anchor="middle">busy or calm?</text>
<text class="sub" x="278" y="158" text-anchor="middle">past to future</text>
<text class="sub" x="406" y="158" text-anchor="middle">percent, no drift</text>
<text class="sub" x="534" y="158" text-anchor="middle">train the net</text>
<text class="sub" x="662" y="158" text-anchor="middle">vs a coin</text>

<text class="ev" x="278" y="198" text-anchor="middle">no twin can cross</text>
<rect class="chip" x="234" y="208" width="88" height="24" rx="12"/>
<text class="ok" x="278" y="224" text-anchor="middle">FIXED</text>

<text class="ev" x="406" y="198" text-anchor="middle">stays in its band</text>
<rect class="chip" x="362" y="208" width="88" height="24" rx="12"/>
<text class="ok" x="406" y="224" text-anchor="middle">FIXED</text>

<text class="ev" x="534" y="198" text-anchor="middle">0.494 to 0.630</text>
<rect class="chip" x="490" y="208" width="88" height="24" rx="12"/>
<text class="ok" x="534" y="224" text-anchor="middle">CLEAR</text>

<text class="ev" x="662" y="198" text-anchor="middle">45% busy, 55% calm</text>
<rect class="chip" x="618" y="208" width="88" height="24" rx="12"/>
<text class="ok" x="662" y="224" text-anchor="middle">CLEAR</text>

<line x1="40" y1="252" x2="720" y2="252" stroke="#ececf0" stroke-width="1"/>
<text class="ft" x="40" y="276">Every fault we found is repaired. So we run it again, and this time we trust the number.</text>
</svg>
