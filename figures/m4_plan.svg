<svg viewBox="0 0 630 891" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="630" height="891" fill="#ffffff"/>
<rect x="0" y="0" width="8" height="891" fill="#3a6ea5"/>
<text x="34" y="52" font-size="27" fill="#3a6ea5" font-weight="600" font-style="normal" text-anchor="start">The plan</text>
<text x="34" y="74" font-size="12" fill="#5a6472" font-weight="normal" font-style="normal" text-anchor="start">Four questions experience forces you to answer before you build a model.</text>
<text x="34" y="91" font-size="12" fill="#5a6472" font-weight="normal" font-style="normal" text-anchor="start">Filled in here for one job: sizing tomorrow's risk cushion.</text>
<line x1="34" y1="104" x2="602" y2="104" stroke="#eef1f4" stroke-width="2"/>
<circle cx="43" cy="124" r="11" fill="#3a6ea5"/>
<text x="43" y="128" font-size="13" fill="#ffffff" font-weight="700" font-style="normal" text-anchor="middle">1</text>
<text x="64" y="128" font-size="14.5" fill="#22303f" font-weight="700" font-style="normal" text-anchor="start">PURPOSE</text>
<text x="64" y="145" font-size="12" fill="#3a6ea5" font-weight="normal" font-style="italic" text-anchor="start">What decision needs this number, and what does that decision demand of it?</text>
<text x="64" y="166" font-size="11.5" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">The decision: size tomorrow's cushion against a big move.</text>
<text x="64" y="182" font-size="11" fill="#5a6472" font-weight="normal" font-style="normal" text-anchor="start">It needs the SIZE of the move, not direction, as a calibrated probability.</text>
<text x="64" y="197" font-size="11" fill="#5a6472" font-weight="normal" font-style="normal" text-anchor="start">Good enough means honest, not high.</text>
<circle cx="43" cy="227" r="11" fill="#3a6ea5"/>
<text x="43" y="231" font-size="13" fill="#ffffff" font-weight="700" font-style="normal" text-anchor="middle">2</text>
<text x="64" y="231" font-size="14.5" fill="#22303f" font-weight="700" font-style="normal" text-anchor="start">BETS</text>
<text x="64" y="248" font-size="12" fill="#3a6ea5" font-weight="normal" font-style="italic" text-anchor="start">What does each step quietly assume? Test it, do not trust it.</text>
<text x="602" y="231" font-size="10" fill="#5a6472" text-anchor="end" font-style="italic">first four: learned in Sections 2-3      ⊕ = new to this job</text>
<text x="64" y="266" font-size="10" fill="#5a6472" font-weight="700" font-style="normal" text-anchor="start">STEP</text>
<text x="130" y="266" font-size="10" fill="#5a6472" font-weight="700" font-style="normal" text-anchor="start">quietly assumes...</text>
<text x="358" y="266" font-size="10" fill="#5a6472" font-weight="700" font-style="normal" text-anchor="start">so we...</text>
<rect x="58" y="260" width="544" height="23" rx="4" fill="#f7f9fb"/>
<text x="64" y="276" font-size="11.5" fill="#3a6ea5" font-weight="700" font-style="normal" text-anchor="start">Split</text>
<text x="130" y="276" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">the days are interchangeable</text>
<text x="358" y="276" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">cut past -&gt; future</text>
<rect x="58" y="286" width="544" height="23" rx="4" fill="#f7f9fb"/>
<text x="64" y="302" font-size="11.5" fill="#3a6ea5" font-weight="700" font-style="normal" text-anchor="start">Scale</text>
<text x="130" y="302" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">a normal day stays normal</text>
<text x="358" y="302" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">keep percent, watch drift</text>
<rect x="58" y="312" width="544" height="23" rx="4" fill="#f7f9fb"/>
<text x="64" y="328" font-size="11.5" fill="#3a6ea5" font-weight="700" font-style="normal" text-anchor="start">Measure</text>
<text x="130" y="328" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">accuracy is the yardstick</text>
<text x="358" y="328" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">a cushion needs calibration</text>
<rect x="58" y="338" width="544" height="23" rx="4" fill="#f7f9fb"/>
<text x="64" y="354" font-size="11.5" fill="#3a6ea5" font-weight="700" font-style="normal" text-anchor="start">Frame</text>
<text x="130" y="354" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">the bar holds still</text>
<text x="358" y="354" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">judge era by era</text>
<rect x="58" y="364" width="544" height="23" rx="4" fill="#fbf3f2"/>
<text x="64" y="380" font-size="11.5" fill="#c85a52" font-weight="700" font-style="normal" text-anchor="start">⊕ Tail</text>
<text x="130" y="380" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">past extremes = tomorrow's</text>
<text x="358" y="380" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">backtest the breaches</text>
<rect x="58" y="390" width="544" height="23" rx="4" fill="#fbf3f2"/>
<text x="64" y="406" font-size="11.5" fill="#c85a52" font-weight="700" font-style="normal" text-anchor="start">⊕ Cost</text>
<text x="130" y="406" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">the two errors weigh the same</text>
<text x="358" y="406" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">lean to cover; count breaches</text>
<rect x="58" y="416" width="544" height="23" rx="4" fill="#fbf3f2"/>
<text x="64" y="432" font-size="11.5" fill="#c85a52" font-weight="700" font-style="normal" text-anchor="start">⊕ Timing</text>
<text x="130" y="432" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">mistakes fall evenly</text>
<text x="358" y="432" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">check if breaches cluster</text>
<circle cx="43" cy="472" r="11" fill="#3a6ea5"/>
<text x="43" y="476" font-size="13" fill="#ffffff" font-weight="700" font-style="normal" text-anchor="middle">3</text>
<text x="64" y="476" font-size="14.5" fill="#22303f" font-weight="700" font-style="normal" text-anchor="start">TOOLS</text>
<text x="64" y="493" font-size="12" fill="#3a6ea5" font-weight="normal" font-style="italic" text-anchor="start">Does it reach the honest limit, or could it break the model?</text>
<circle cx="70" cy="510" r="7.5" fill="#e6f0e6"/>
<text x="70" y="513.5" font-size="10" fill="#3a7d44" font-weight="700" font-style="normal" text-anchor="middle">✓</text>
<text x="86" y="514" font-size="11.5" fill="#22303f" font-weight="600" font-style="normal" text-anchor="start">a better optimiser</text>
<text x="222" y="514" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">reaches faster, not higher</text>
<circle cx="70" cy="533" r="7.5" fill="#e6f0e6"/>
<text x="70" y="536.5" font-size="10" fill="#3a7d44" font-weight="700" font-style="normal" text-anchor="middle">✓</text>
<text x="86" y="537" font-size="11.5" fill="#22303f" font-weight="600" font-style="normal" text-anchor="start">average the seeds</text>
<text x="222" y="537" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">cancels a lucky start</text>
<circle cx="70" cy="556" r="7.5" fill="#fbeee8"/>
<text x="70" y="559.5" font-size="10" fill="#c85a52" font-weight="700" font-style="normal" text-anchor="middle">!</text>
<text x="86" y="560" font-size="11.5" fill="#22303f" font-weight="600" font-style="normal" text-anchor="start">more layers / width</text>
<text x="222" y="560" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">a trap: check for overfit</text>
<circle cx="70" cy="579" r="7.5" fill="#e6f0e6"/>
<text x="70" y="582.5" font-size="10" fill="#3a7d44" font-weight="700" font-style="normal" text-anchor="middle">✓</text>
<text x="86" y="583" font-size="11.5" fill="#22303f" font-weight="600" font-style="normal" text-anchor="start">search the settings</text>
<text x="222" y="583" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">only on a leash: declare budget, seal the test</text>
<circle cx="70" cy="602" r="7.5" fill="#e6f0e6"/>
<text x="70" y="605.5" font-size="10" fill="#3a7d44" font-weight="700" font-style="normal" text-anchor="middle">✓</text>
<text x="86" y="606" font-size="11.5" fill="#22303f" font-weight="600" font-style="normal" text-anchor="start">calibration</text>
<text x="222" y="606" font-size="11" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">only if the number is off</text>
<circle cx="43" cy="643" r="11" fill="#3a6ea5"/>
<text x="43" y="647" font-size="13" fill="#ffffff" font-weight="700" font-style="normal" text-anchor="middle">4</text>
<text x="64" y="647" font-size="14.5" fill="#22303f" font-weight="700" font-style="normal" text-anchor="start">VERDICT</text>
<text x="64" y="664" font-size="12" fill="#3a6ea5" font-weight="normal" font-style="italic" text-anchor="start">Fixed before any result. What is good enough, and where does it not apply?</text>
<rect x="58" y="671" width="544" height="152" rx="8" fill="#f0f5fa" stroke="#3a6ea5" stroke-width="1.4"/>
<text x="74" y="695" font-size="11.5" fill="#3a6ea5" font-weight="700" font-style="normal" text-anchor="start">ACCEPT if</text>
<text x="140" y="695" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">calibrated  +  discriminates  +  fewer breaches at the same cushion,</text>
<text x="140" y="710" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">and near the ceiling (~0.60), never above it   (above = a leak).</text>
<text x="74" y="737" font-size="11.5" fill="#3a6ea5" font-weight="700" font-style="normal" text-anchor="start">LIMITS</text>
<text x="140" y="737" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">tomorrow only  |  size, not direction  |  one market  |  it expires</text>
<text x="74" y="765" font-size="11.5" fill="#3a6ea5" font-weight="700" font-style="normal" text-anchor="start">USE FOR</text>
<text x="140" y="765" font-size="11" fill="#22303f" font-weight="normal" font-style="normal" text-anchor="start">sizing a cushion, defensively.  Nowhere else, however good it looks.</text>
<text x="74" y="797" font-size="10.5" fill="#5a6472" font-weight="normal" font-style="italic" text-anchor="start">None of this is foresight. It is memory: the earlier traps taught us every line above.</text>
</svg>