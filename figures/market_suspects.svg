<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" fill="#1a1a1a" font-weight="700">Can we trust 0.612?</text>
  <text x="40" y="62" font-size="12" fill="#6b7480">If the number is lying, there are only three places the lie can hide.</text>

  <line x1="40" y1="78" x2="720" y2="78" stroke="#ececf0" stroke-width="1"/>
  <circle cx="58" cy="105" r="14" fill="#3a6ea5"/><text x="58" y="110" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="86" y="102" font-size="14" fill="#1f2d3d" font-weight="600">The model</text>
  <text x="86" y="120" font-size="11" fill="#6b7480">did it actually learn?</text>
  <text x="330" y="112" font-size="12" fill="#2b333f">0.494  to  0.630</text>
  <rect x="608" y="92" width="98" height="26" rx="13" fill="#eaf3ec" stroke="#4a8a5c" stroke-width="1.2"/>
  <text x="657" y="110" font-size="12" fill="#3d7550" text-anchor="middle" font-weight="700">CLEAR</text>

  <line x1="40" y1="143" x2="720" y2="143" stroke="#ececf0" stroke-width="1"/>
  <circle cx="58" cy="170" r="14" fill="#3a6ea5"/><text x="58" y="175" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="86" y="167" font-size="14" fill="#1f2d3d" font-weight="600">The answer</text>
  <text x="86" y="185" font-size="11" fill="#6b7480">deciding, or just parroting?</text>
  <text x="330" y="177" font-size="12" fill="#2b333f">45% busy, 55% calm</text>
  <rect x="608" y="157" width="98" height="26" rx="13" fill="#eaf3ec" stroke="#4a8a5c" stroke-width="1.2"/>
  <text x="657" y="175" font-size="12" fill="#3d7550" text-anchor="middle" font-weight="700">CLEAR</text>

  <line x1="40" y1="208" x2="720" y2="208" stroke="#ececf0" stroke-width="1"/>
  <circle cx="58" cy="235" r="14" fill="#3a6ea5"/><text x="58" y="240" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="86" y="232" font-size="14" fill="#1f2d3d" font-weight="600">The test</text>
  <text x="86" y="250" font-size="11" fill="#6b7480">was the exam fair?</text>
  <text x="330" y="242" font-size="12" fill="#2b333f">every shuffle lands near 0.61</text>
  <rect x="608" y="222" width="98" height="26" rx="13" fill="#eaf3ec" stroke="#4a8a5c" stroke-width="1.2"/>
  <text x="657" y="240" font-size="12" fill="#3d7550" text-anchor="middle" font-weight="700">CLEAR</text>

  <line x1="40" y1="273" x2="720" y2="273" stroke="#ececf0" stroke-width="1"/>
  <text x="40" y="298" font-size="13" fill="#2b333f" font-weight="600">Three suspects, three clear. So we trust the number.</text>
</svg>
