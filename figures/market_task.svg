<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="320" fill="#ffffff"/>
  <text x="50" y="32" font-size="16" fill="#2b333f" font-weight="600">The task: from the last 5 days, guess tomorrow</text>

  <!-- usual level (dashed) -->
  <line x1="50" y1="160" x2="600" y2="160" stroke="#8a94a3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="50" y="153" font-size="11" fill="#5a6472">usual level: half the days are busier, half calmer</text>

  <!-- baseline -->
  <line x1="50" y1="220" x2="600" y2="220" stroke="#c4ccd6" stroke-width="1"/>

  <!-- earlier days (context) -->
  <rect x="60"  y="180" width="34" height="40"  rx="3" fill="#b8c0cc"/>
  <rect x="108" y="125" width="34" height="95"  rx="3" fill="#3a6ea5"/>
  <rect x="156" y="190" width="34" height="30"  rx="3" fill="#b8c0cc"/>
  <rect x="204" y="150" width="34" height="70"  rx="3" fill="#3a6ea5"/>
  <rect x="252" y="195" width="34" height="25"  rx="3" fill="#b8c0cc"/>

  <!-- the window: the last 5 days that feed the guess -->
  <rect x="300" y="110" width="34" height="110" rx="3" fill="#3a6ea5"/>
  <rect x="348" y="175" width="34" height="45"  rx="3" fill="#b8c0cc"/>
  <rect x="396" y="135" width="34" height="85"  rx="3" fill="#3a6ea5"/>
  <rect x="444" y="185" width="34" height="35"  rx="3" fill="#b8c0cc"/>
  <rect x="492" y="120" width="34" height="100" rx="3" fill="#3a6ea5"/>

  <!-- window bracket -->
  <path d="M300 96 L300 88 L526 88 L526 96" fill="none" stroke="#2b333f" stroke-width="1.4"/>
  <text x="413" y="80" font-size="12" fill="#2b333f" text-anchor="middle">the last 5 days (how big each moved)</text>
  <text x="413" y="246" font-size="11" fill="#5a6472" text-anchor="middle">these five feed the guess</text>

  <!-- arrow -->
  <line x1="548" y1="150" x2="612" y2="150" stroke="#2b333f" stroke-width="1.6"/>
  <path d="M612 150 l-9 -5 l0 10 z" fill="#2b333f"/>

  <!-- tomorrow -->
  <rect x="624" y="112" width="120" height="80" rx="6" fill="none" stroke="#3a6ea5" stroke-width="1.6"/>
  <text x="684" y="138" font-size="13" fill="#2b333f" text-anchor="middle" font-weight="600">tomorrow?</text>
  <text x="684" y="160" font-size="12" fill="#5a6472" text-anchor="middle">busy or calm</text>
  <text x="684" y="182" font-size="18" fill="#3a6ea5" text-anchor="middle" font-weight="700">?</text>

  <!-- legend -->
  <rect x="50" y="278" width="16" height="16" rx="3" fill="#3a6ea5"/>
  <text x="72" y="291" font-size="11" fill="#5a6472">busy day (above usual)</text>
  <rect x="230" y="278" width="16" height="16" rx="3" fill="#b8c0cc"/>
  <text x="252" y="291" font-size="11" fill="#5a6472">calm day (below usual)</text>
</svg>
