<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The market trail, two traps at once</title>
<desc>A decision tree with two branches from the question of whether the market edge is real. The left branch is the split trap: the shuffle scores 0.618 but the honest chronological split scores 0.587, they disagree, the rows turn out to be near-twins so the shuffle leaked a neighbour, and the honest number to keep is around 0.60. The right branch is the scaling trap: the same model with the feature in raw points scores 0.510, a coin, because the index drifts from 677 to 7610 and the frozen scaler is lost, and a rolling scaler recovers it to 0.555. Both branches converge: both traps hid in the same place, the data we never looked at.</desc>
<rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:15px;font-weight:600}
.b{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:13px}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999999"/></marker></defs>
<text class="ti" x="20" y="26" text-anchor="start">The market trail, two traps at once</text>
<rect x="210" y="42" width="260" height="36" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="64" text-anchor="middle">S&#38;P closes: is the edge real?</text>
<line x1="285" y1="78" x2="205" y2="108" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="395" y1="78" x2="475" y2="108" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="40" y="110" width="270" height="44" rx="8" fill="#ffffff" stroke="#d98b4a" stroke-width="2"/>
<text class="b" x="175" y="130" text-anchor="middle">shuffle 0.618, honest 0.587</text>
<text class="b" x="175" y="147" text-anchor="middle">they disagree</text>
<line x1="175" y1="154" x2="175" y2="170" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="40" y="172" width="270" height="44" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="175" y="192" text-anchor="middle">the rows are near-twins:</text>
<text class="b" x="175" y="209" text-anchor="middle">the shuffle leaked a neighbour</text>
<line x1="175" y1="216" x2="175" y2="232" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="40" y="234" width="270" height="36" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="175" y="256" text-anchor="middle">keep the honest ~0.60</text>
<line x1="200" y1="270" x2="288" y2="296" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="370" y="110" width="270" height="44" rx="8" fill="#ffffff" stroke="#d98b4a" stroke-width="2"/>
<text class="b" x="505" y="130" text-anchor="middle">same model, feature in points:</text>
<text class="b" x="505" y="147" text-anchor="middle">0.510, a coin</text>
<line x1="505" y1="154" x2="505" y2="170" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="370" y="172" width="270" height="44" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="505" y="192" text-anchor="middle">the index drifts 677 to 7610,</text>
<text class="b" x="505" y="209" text-anchor="middle">the frozen scaler is lost</text>
<line x1="505" y1="216" x2="505" y2="232" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="370" y="234" width="270" height="36" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="505" y="256" text-anchor="middle">rolling scaler recovers: 0.555</text>
<line x1="480" y1="270" x2="392" y2="296" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="185" y="298" width="310" height="48" rx="8" fill="#e4efe8" stroke="#6aa87f" stroke-width="1.5"/>
<text class="b" x="340" y="318" text-anchor="middle">both traps hid in the same place:</text>
<text class="b" x="340" y="335" text-anchor="middle">the data we never looked at</text>
</svg>
