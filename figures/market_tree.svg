<svg width="100%" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How we cornered the market data, one try at a time</title>
<desc>A decision tree of the investigation. From "what can this data predict", one branch tries direction, up or down, and dead-ends at 0.54, a coin flip. The other branch predicts a busy day: by the book it scores 0.615, which looks like an edge; the honest past-to-future split scores only 0.585 and the two disagree; looking at the rows shows they are near-twins sharing four of five numbers, so the shuffle leaked one, and the honest answer is 0.585.</desc>
<rect x="0" y="0" width="680" height="356" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:15px;font-weight:600}
.b{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:13px}
.d{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#8a8a8a;font-size:12px}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999999"/></marker></defs>
<text class="ti" x="20" y="26" text-anchor="start">Cornering the market data, one try at a time</text>
<rect x="210" y="42" width="260" height="38" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="66" text-anchor="middle">What can this data predict?</text>
<line x1="300" y1="80" x2="150" y2="102" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="340" y1="80" x2="340" y2="102" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="44" y="104" width="168" height="50" rx="8" fill="#eeeeee" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="d" x="128" y="124" text-anchor="middle">up or down? &#8594; 0.54</text>
<text class="d" x="128" y="140" text-anchor="middle">a coin flip. dead end.</text>
<rect x="250" y="104" width="180" height="38" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="128" text-anchor="middle">how big? a busy day</text>
<line x1="340" y1="142" x2="340" y2="164" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="190" y="166" width="300" height="38" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="190" text-anchor="middle">by the book (shuffle): 0.615, an edge?</text>
<line x1="340" y1="204" x2="340" y2="228" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="190" y="230" width="300" height="38" rx="8" fill="#ffffff" stroke="#d98b4a" stroke-width="2"/>
<text class="b" x="340" y="254" text-anchor="middle">the honest way: 0.585, they disagree!</text>
<line x1="340" y1="268" x2="340" y2="292" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="190" y="294" width="300" height="50" rx="8" fill="#e4efe8" stroke="#6aa87f" stroke-width="1.5"/>
<text class="b" x="340" y="314" text-anchor="middle">look at the rows: near-twins, sharing 4 of 5</text>
<text class="b" x="340" y="332" text-anchor="middle">the shuffle leaked one. honest answer: 0.585.</text>
</svg>
