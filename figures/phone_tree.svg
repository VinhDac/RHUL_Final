<svg width="100%" viewBox="0 0 680 392" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The phone trail, one try at a time</title>
<desc>A decision trail. Shuffling the rows by the book scores 0.966, almost perfect, which raises a doubt: is the model reading activity, or just recognising these thirty people? Holding out whole people drops the score to 0.948 and it wobbles between 0.93 and 0.97. That leaves a question: a real identity leak, or just harder strangers? A control that fixes the same test people and changes only whether they were seen in training settles it: the gap is plus 0.022 every single time, so the leak is real, and the honest number to keep is about 0.947.</desc>
<rect x="0" y="0" width="680" height="392" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:15px;font-weight:600}
.b{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:13px}
.d{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#8a8a8a;font-size:12px}
</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999999"/></marker></defs>
<text class="ti" x="20" y="26" text-anchor="start">The phone trail, one try at a time</text>
<rect x="200" y="42" width="280" height="36" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="64" text-anchor="middle">Shuffle by the book: 0.966, almost perfect</text>
<line x1="340" y1="78" x2="340" y2="96" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="200" y="98" width="280" height="36" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="120" text-anchor="middle">Activity, or just these thirty people?</text>
<line x1="340" y1="134" x2="340" y2="152" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="190" y="154" width="300" height="48" rx="8" fill="#ffffff" stroke="#d98b4a" stroke-width="2"/>
<text class="b" x="340" y="174" text-anchor="middle">Hold out whole people: 0.948</text>
<text class="d" x="340" y="192" text-anchor="middle">but shaky, 0.93 to 0.97</text>
<line x1="340" y1="202" x2="340" y2="220" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="196" y="222" width="288" height="36" rx="8" fill="#f6f6f8" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="b" x="340" y="244" text-anchor="middle">A real leak, or just harder strangers?</text>
<line x1="340" y1="258" x2="340" y2="276" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="205" y="278" width="270" height="36" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text class="b" x="340" y="300" text-anchor="middle">Same test, seen vs unseen: a control</text>
<line x1="340" y1="314" x2="340" y2="332" stroke="#999999" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="190" y="334" width="300" height="50" rx="8" fill="#e4efe8" stroke="#6aa87f" stroke-width="1.5"/>
<text class="b" x="340" y="354" text-anchor="middle">gap +0.022, every time: the leak is real</text>
<text class="b" x="340" y="372" text-anchor="middle">keep the honest 0.947</text>
</svg>
