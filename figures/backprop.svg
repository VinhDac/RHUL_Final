<svg width="100%" viewBox="0 0 680 310" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Backprop: the output error flows back to every weight</title>
<desc>The same small network, input to hidden to output. A bold arrow across the top runs backward, right to left. At the output the error is the gap p minus y. It is multiplied by the transpose of the second weights and passed through the ReLU gate to the hidden layer, then on to the first weights. Below, each weight layer's gradient is shown: dL/dW2 is the gap times the hidden values, dL/dW1 is the passed-back gradient times the input.</desc>
<rect x="0" y="0" width="680" height="310" fill="#ffffff"/>
<style>
.ti{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1a1a1a;font-size:15px;font-weight:600}
.lab{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#555555;font-size:13px}
.node{fill:#ffffff;stroke:#333333;stroke-width:1.5}
.wire{stroke:#cfcfcf;stroke-width:1}
.gt{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#a8492a;font-size:12.5px;font-weight:500}
.gline{stroke:#c05a34;stroke-width:2.6;fill:none}
.gcon{stroke:#c05a34;stroke-width:1;stroke-dasharray:3 3;opacity:0.5}
</style>
<defs><marker id="bk" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c05a34"/></marker></defs>
<text class="ti" x="340" y="26" text-anchor="middle">Backprop: the output error flows back to every weight</text>
<line class="wire" x1="120" y1="160" x2="340" y2="130"/>
<line class="wire" x1="120" y1="160" x2="340" y2="190"/>
<line class="wire" x1="120" y1="160" x2="340" y2="250"/>
<line class="wire" x1="120" y1="225" x2="340" y2="130"/>
<line class="wire" x1="120" y1="225" x2="340" y2="190"/>
<line class="wire" x1="120" y1="225" x2="340" y2="250"/>
<line class="wire" x1="340" y1="130" x2="560" y2="160"/>
<line class="wire" x1="340" y1="130" x2="560" y2="225"/>
<line class="wire" x1="340" y1="190" x2="560" y2="160"/>
<line class="wire" x1="340" y1="190" x2="560" y2="225"/>
<line class="wire" x1="340" y1="250" x2="560" y2="160"/>
<line class="wire" x1="340" y1="250" x2="560" y2="225"/>
<line class="gline" x1="600" y1="62" x2="82" y2="62" marker-end="url(#bk)"/>
<line class="gcon" x1="560" y1="66" x2="560" y2="142"/>
<line class="gcon" x1="340" y1="66" x2="340" y2="112"/>
<line class="gcon" x1="120" y1="66" x2="120" y2="142"/>
<rect x="514" y="36" width="92" height="21" rx="5" fill="#c05a34" opacity="0.12"/>
<text class="gt" x="560" y="51" text-anchor="middle">gap = p &#8722; y</text>
<text class="gt" x="340" y="51" text-anchor="middle">&#215; W&#8322;&#7488;, then ReLU gate</text>
<circle class="node" cx="120" cy="160" r="15"/>
<circle class="node" cx="120" cy="225" r="15"/>
<circle class="node" cx="340" cy="130" r="15"/>
<circle class="node" cx="340" cy="190" r="15"/>
<circle class="node" cx="340" cy="250" r="15"/>
<circle class="node" cx="560" cy="160" r="15"/>
<circle class="node" cx="560" cy="225" r="15"/>
<text class="lab" x="120" y="258" text-anchor="middle">input x</text>
<text class="lab" x="340" y="283" text-anchor="middle">hidden h, ReLU</text>
<text class="lab" x="560" y="258" text-anchor="middle">guess p</text>
<text class="gt" x="215" y="300" text-anchor="middle">&#8706;L/&#8706;W&#8321; = (&#8706;L/&#8706;a) x&#7488;</text>
<text class="gt" x="452" y="300" text-anchor="middle">&#8706;L/&#8706;W&#8322; = (p &#8722; y) h&#7488;</text>
</svg>
