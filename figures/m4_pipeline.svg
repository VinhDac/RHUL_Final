<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="200" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aa7b4"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#3a6ea5">The recipe, one more time</text>
  <text x="380" y="50" text-anchor="middle" font-size="12.5" fill="#8895a3">the same five stations, only now each one is decided from what a price needs</text>

  <!-- arrows between the five stations -->
  <line x1="145" y1="122" x2="165" y2="122" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="295" y1="122" x2="315" y2="122" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="445" y1="122" x2="465" y2="122" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="595" y1="122" x2="615" y2="122" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 1. Frame -->
  <rect x="15" y="78" width="130" height="90" rx="10" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.8"/>
  <text x="80" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#22303f">Frame</text>
  <text x="80" y="132" text-anchor="middle" font-size="12" fill="#5a6472">the risk</text>
  <text x="80" y="149" text-anchor="middle" font-size="12" fill="#5a6472">a price needs</text>

  <!-- 2. Split -->
  <rect x="165" y="78" width="130" height="90" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
  <text x="230" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#22303f">Split</text>
  <text x="230" y="141" text-anchor="middle" font-size="12" fill="#5a6472">past to future</text>

  <!-- 3. Scale -->
  <rect x="315" y="78" width="130" height="90" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
  <text x="380" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#22303f">Scale</text>
  <text x="380" y="141" text-anchor="middle" font-size="12" fill="#5a6472">no drift</text>

  <!-- 4. Build -->
  <rect x="465" y="78" width="130" height="90" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
  <text x="530" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#22303f">Build</text>
  <text x="530" y="132" text-anchor="middle" font-size="12" fill="#5a6472">the same</text>
  <text x="530" y="149" text-anchor="middle" font-size="12" fill="#5a6472">small network</text>

  <!-- 5. Measure -->
  <rect x="615" y="78" width="130" height="90" rx="10" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.8"/>
  <text x="680" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#22303f">Measure</text>
  <text x="680" y="132" text-anchor="middle" font-size="12" fill="#5a6472">trusted enough</text>
  <text x="680" y="149" text-anchor="middle" font-size="12" fill="#5a6472">to price with?</text>
</svg>
