<svg viewBox="0 0 760 1070" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="1070" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aa7b4"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#3a6ea5">The road we just walked</text>
  <text x="380" y="58" text-anchor="middle" font-size="12.5" fill="#8895a3">each question came from the answer before it, and three of them uncovered a hidden bet</text>

  <!-- continuous light guide -->
  <line x1="380" y1="136" x2="380" y2="920" stroke="#eef1f4" stroke-width="6"/>

  <!-- realization halos (white, so the guide does not show through text) -->
  <rect x="150" y="158" width="460" height="40" fill="#ffffff"/>
  <rect x="150" y="320" width="460" height="22" fill="#ffffff"/>
  <rect x="150" y="486" width="460" height="22" fill="#ffffff"/>
  <rect x="150" y="652" width="460" height="40" fill="#ffffff"/>
  <rect x="150" y="818" width="460" height="22" fill="#ffffff"/>

  <!-- realization text -->
  <text x="380" y="174" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b7b">three suspects checked, all clear,</text>
  <text x="380" y="192" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b7b">but that was one check run five times</text>

  <text x="380" y="336" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b7b">past to future: 0.587, the near-twins had leaked</text>

  <text x="380" y="502" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b7b">the frozen scaler drifts, and 0.587 falls to a coin</text>

  <text x="380" y="668" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b7b">rebuilt clean, every station cleared, then</text>
  <text x="380" y="686" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b7b">five eras disagree: there was never one number</text>

  <text x="380" y="834" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b7b">the difficulty moved, but the pass-mark never did</text>

  <!-- BET pills -->
  <g>
    <rect x="196" y="352" width="368" height="26" rx="13" fill="#fdecea" stroke="#c85a52" stroke-width="1.2"/>
    <text x="380" y="369" text-anchor="middle" font-size="12" font-weight="600" fill="#b0433b">SPLIT bet: one day has nothing to do with the next</text>
  </g>
  <g>
    <rect x="214" y="518" width="332" height="26" rx="13" fill="#fdecea" stroke="#c85a52" stroke-width="1.2"/>
    <text x="380" y="535" text-anchor="middle" font-size="12" font-weight="600" fill="#b0433b">SCALE bet: a normal day stays normal</text>
  </g>
  <g>
    <rect x="196" y="850" width="368" height="26" rx="13" fill="#fdecea" stroke="#c85a52" stroke-width="1.2"/>
    <text x="380" y="867" text-anchor="middle" font-size="12" font-weight="600" fill="#b0433b">FRAME bet: the question and the bar were just given</text>
  </g>

  <!-- arrows into each next bubble -->
  <line x1="380" y1="232" x2="380" y2="252" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="398" x2="380" y2="418" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="564" x2="380" y2="584" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="730" x2="380" y2="750" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="380" y1="896" x2="380" y2="916" stroke="#b8c0cc" stroke-width="2" marker-end="url(#ar)"/>

  <!-- question bubbles -->
  <g>
    <rect x="170" y="90" width="420" height="46" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
    <text x="380" y="118" text-anchor="middle" font-size="15.5" font-weight="600" fill="#22303f">Can we trust 0.612?</text>
  </g>
  <g>
    <rect x="170" y="256" width="420" height="46" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
    <text x="380" y="284" text-anchor="middle" font-size="15.5" font-weight="600" fill="#22303f">So check the split a different way?</text>
  </g>
  <g>
    <rect x="170" y="422" width="420" height="46" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
    <text x="380" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#22303f">What else did we check just one way?</text>
  </g>
  <g>
    <rect x="170" y="588" width="420" height="46" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
    <text x="380" y="616" text-anchor="middle" font-size="15.5" font-weight="600" fill="#22303f">What else did we freeze and forget?</text>
  </g>
  <g>
    <rect x="170" y="754" width="420" height="46" rx="10" fill="#f5f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
    <text x="380" y="782" text-anchor="middle" font-size="15.5" font-weight="600" fill="#22303f">Where did the fixed pass-mark come from?</text>
  </g>
  <g>
    <rect x="170" y="920" width="420" height="60" rx="10" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="380" y="945" text-anchor="middle" font-size="15.5" font-weight="600" fill="#22303f">After all that care,</text>
    <text x="380" y="966" text-anchor="middle" font-size="15.5" font-weight="600" fill="#22303f">what can we still say?</text>
  </g>

  <!-- forward: the door into section 4 -->
  <line x1="380" y1="980" x2="380" y2="1018" stroke="#3a6ea5" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="380" y="1040" text-anchor="middle" font-size="13" font-weight="600" fill="#3a6ea5">on to Section 4: the same problem, taken back to the top</text>
</svg>
